name: AWS EKS Application Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag, for example v1.2.3"
        required: true
        type: string
      confirm_publish:
        description: "Publish the image and attestations to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nmanognya/platform-demo

jobs:
  release:
    name: Build, publish, and attest image
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest

    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push once
        id: push
        uses: docker/build-push-action@v6
        with:
          context: aws-eks-platform-reference/app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Generate SPDX SBOM from published digest
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: /tmp/platform-demo.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: /tmp/platform-demo.spdx.json
          push-to-registry: true

      - name: Write release summary
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published application image"
            echo
            echo "- Tag: \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Production Helm value: \`image.digest=${DIGEST}\`"
            echo
            echo "Promote this exact digest through environments; do not rebuild for production."
          } >> "$GITHUB_STEP_SUMMARY"

name: AWS EKS App CI

on:
  pull_request:
    paths:
      - "aws-eks-platform-reference/app/**"
      - ".github/workflows/aws-eks-app-ci.yml"
  push:
    branches:
      - main
    paths:
      - "aws-eks-platform-reference/app/**"
      - ".github/workflows/aws-eks-app-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            aws-eks-platform-reference/app/requirements.txt
            aws-eks-platform-reference/app/requirements-dev.txt

      - name: Install dependencies
        working-directory: aws-eks-platform-reference/app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run application tests
        working-directory: aws-eks-platform-reference/app
        run: pytest -q

      - name: Build container image
        run: docker build -t platform-demo:test aws-eks-platform-reference/app

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-demo:test
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

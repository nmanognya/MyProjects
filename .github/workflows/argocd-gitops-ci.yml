name: Argo CD GitOps CI

on:
  pull_request:
    paths:
      - "argocd-gitops-platform-reference/**"
      - ".github/workflows/argocd-gitops-ci.yml"
  push:
    branches:
      - main
    paths:
      - "argocd-gitops-platform-reference/**"
      - ".github/workflows/argocd-gitops-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.3

      - name: Validate scripts
        run: |
          python3 -m py_compile argocd-gitops-platform-reference/scripts/promote-image.py
          bash -n argocd-gitops-platform-reference/scripts/test-promotion.sh
          bash -n argocd-gitops-platform-reference/scripts/validate-gitops.sh

      - name: Test image promotion contract
        run: bash argocd-gitops-platform-reference/scripts/test-promotion.sh

      - name: Validate GitOps contracts
        run: bash argocd-gitops-platform-reference/scripts/validate-gitops.sh

      - name: Validate rendered Kubernetes schemas
        shell: bash
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "Validating ${env}"
            kubectl kustomize "argocd-gitops-platform-reference/workloads/podinfo/overlays/${env}" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
                  -strict -summary -kubernetes-version 1.35.0
          done

name: AWS EKS Helm CI

on:
  pull_request:
    paths:
      - "aws-eks-platform-reference/helm/**"
      - ".github/workflows/aws-eks-helm-ci.yml"
  push:
    branches:
      - main
    paths:
      - "aws-eks-platform-reference/helm/**"
      - ".github/workflows/aws-eks-helm-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Lint, render, and scan Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.20.2

      - name: Lint chart
        run: helm lint aws-eks-platform-reference/helm/platform-demo --strict

      - name: Render Kubernetes manifests
        run: |
          helm template platform-demo aws-eks-platform-reference/helm/platform-demo \
            --namespace platform-demo \
            > aws-eks-platform-reference/helm/rendered.yaml

      - name: Scan rendered Kubernetes manifests with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: aws-eks-platform-reference/helm/rendered.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

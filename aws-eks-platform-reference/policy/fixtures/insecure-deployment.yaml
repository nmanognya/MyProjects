apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-example
  template:
    metadata:
      labels:
        app: insecure-example
    spec:
      automountServiceAccountToken: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          resources: {}

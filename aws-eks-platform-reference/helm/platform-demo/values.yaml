replicaCount: 2

image:
  repository: ghcr.io/nmanognya/platform-demo
  tag: "example"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: platform-demo
  automountServiceAccountToken: false

observability:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    labels: {}
    availabilityFor: 10m
    restartWindow: 15m
    restartThreshold: 3
    slo:
      availabilityTarget: 0.999
      latencyTarget: 0.95
      latencyThresholdSeconds: 0.5
      fastBurnWindow: 5m
      fastBurnFor: 5m
      fastBurnErrorRatio: 0.0144
      slowBurnWindow: 30m
      slowBurnFor: 30m
      slowBurnErrorRatio: 0.006

{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-platform-alerts
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.observability.prometheusRule.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  groups:
    - name: {{ .Release.Name }}.platform.rules
      rules:
        - alert: PlatformDemoDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ .Release.Name }}"}
              < kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}",deployment="{{ .Release.Name }}"}
          for: {{ .Values.observability.prometheusRule.availabilityFor }}
          labels:
            severity: warning
            service: {{ .Release.Name }}
          annotations:
            summary: "{{ .Release.Name }} has fewer available replicas than desired"
            description: "The deployment has remained below its desired replica count for {{ .Values.observability.prometheusRule.availabilityFor }}."
        - alert: PlatformDemoContainerRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="{{ .Chart.Name }}"}[{{ .Values.observability.prometheusRule.restartWindow }}])
              > {{ .Values.observability.prometheusRule.restartThreshold }}
          labels:
            severity: warning
            service: {{ .Release.Name }}
          annotations:
            summary: "{{ .Release.Name }} containers are restarting repeatedly"
            description: "A workload container restarted more than {{ .Values.observability.prometheusRule.restartThreshold }} times within {{ .Values.observability.prometheusRule.restartWindow }}."
    - name: {{ .Release.Name }}.slo.rules
      rules:
        - record: platform_demo:http_requests:rate5m
          expr: |
            sum(rate(http_requests_total[5m]))
        - record: platform_demo:http_5xx_ratio:5m
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
        - record: platform_demo:http_latency_le_target_ratio:5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{le="{{ .Values.observability.prometheusRule.slo.latencyThresholdSeconds }}"}[5m]))
              / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 0.001)
        - alert: PlatformDemoFastErrorBudgetBurn
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[{{ .Values.observability.prometheusRule.slo.fastBurnWindow }}]))
                / clamp_min(sum(rate(http_requests_total[{{ .Values.observability.prometheusRule.slo.fastBurnWindow }}])), 0.001)
            ) > {{ .Values.observability.prometheusRule.slo.fastBurnErrorRatio }}
          for: {{ .Values.observability.prometheusRule.slo.fastBurnFor }}
          labels:
            severity: critical
            service: {{ .Release.Name }}
            slo: availability
          annotations:
            summary: "{{ .Release.Name }} is consuming its availability error budget quickly"
            description: "The HTTP 5xx ratio exceeded {{ .Values.observability.prometheusRule.slo.fastBurnErrorRatio }} over {{ .Values.observability.prometheusRule.slo.fastBurnWindow }}, indicating a fast burn against the {{ .Values.observability.prometheusRule.slo.availabilityTarget }} availability target."
        - alert: PlatformDemoSlowErrorBudgetBurn
          expr: |
            (
              sum(rate(http_requests_total{status=~"5.."}[{{ .Values.observability.prometheusRule.slo.slowBurnWindow }}]))
                / clamp_min(sum(rate(http_requests_total[{{ .Values.observability.prometheusRule.slo.slowBurnWindow }}])), 0.001)
            ) > {{ .Values.observability.prometheusRule.slo.slowBurnErrorRatio }}
          for: {{ .Values.observability.prometheusRule.slo.slowBurnFor }}
          labels:
            severity: warning
            service: {{ .Release.Name }}
            slo: availability
          annotations:
            summary: "{{ .Release.Name }} is sustaining elevated error-budget burn"
            description: "The HTTP 5xx ratio exceeded {{ .Values.observability.prometheusRule.slo.slowBurnErrorRatio }} over {{ .Values.observability.prometheusRule.slo.slowBurnWindow }}, indicating sustained burn against the availability objective."
        - alert: PlatformDemoLatencyObjectiveAtRisk
          expr: |
            (
              sum(rate(http_request_duration_seconds_bucket{le="{{ .Values.observability.prometheusRule.slo.latencyThresholdSeconds }}"}[5m]))
                / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 0.001)
            ) < {{ .Values.observability.prometheusRule.slo.latencyTarget }}
          for: 10m
          labels:
            severity: warning
            service: {{ .Release.Name }}
            slo: latency
          annotations:
            summary: "{{ .Release.Name }} latency objective is at risk"
            description: "Fewer than {{ .Values.observability.prometheusRule.slo.latencyTarget }} of observed requests completed within {{ .Values.observability.prometheusRule.slo.latencyThresholdSeconds }} seconds for 10 minutes."
{{- end }}

replicaCount: 3

image:
  requireDigest: true

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

observability:
  prometheusRule:
    enabled: true
    availabilityFor: 10m
    restartWindow: 15m
    restartThreshold: 3
